<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro(D)Track</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- ===== Pantalla de acceso ===== -->
  <section id="pantallaAcceso" class="acceso d-none"></section>

  <!-- ===== Aplicación ===== -->
  <section id="pantallaApp" class="d-none">
    <header class="encabezado p-3 d-flex justify-content-between align-items-center">
      <div>
        <h5 class="marca mb-0">Pro(D)Track</h5>
        <small class="text-secondary fw-bold">Monitor de producción hora por hora</small>
      </div>
      <!-- Botón hamburguesa (solo móvil) -->
      <button class="btn btn-outline-secondary rounded-pill d-md-none" type="button"
              data-bs-toggle="offcanvas" data-bs-target="#menuMovil" aria-label="Abrir menú">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </header>

    <div class="contenedor-principal">
      <div class="card shadow-lg tarjeta-principal">
        <div class="row g-0 h-100">
          <!-- Sidebar escritorio -->
          <aside class="col-md-3 border-end bg-light d-none d-md-flex flex-column">
            <div class="p-3 border-bottom"><h5 class="fw-bold text-center mb-0" data-titulo-vista></h5></div>
            <div class="flex-grow-1 min-h-0" data-sidebar></div>
          </aside>

          <!-- Contenido dinámico -->
          <main class="col-12 col-md-9 p-3 p-md-4 bg-light contenido" id="contenido"></main>
        </div>
      </div>
    </div>

    <!-- Sidebar móvil (offcanvas) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuMovil">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold" data-titulo-vista></h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0" data-sidebar></div>
    </div>
  </section>

  <!-- ===== Modal reutilizable para todos los formularios ===== -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-pt" id="modalDialogo">
      <form class="modal-content" id="modalForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modalCuerpo"></div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-pill btn-cancelar" data-bs-dismiss="modal">
            <span class="material-symbols-outlined">cancel</span><span>CANCELAR</span>
          </button>
          <button type="submit" class="btn btn-pill btn-aceptar" id="modalAceptar">
            <span class="material-symbols-outlined">check_circle</span><span id="modalAceptarTexto">ACEPTAR</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="avisos"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
